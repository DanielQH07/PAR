NAME: .smoke_epoch1
DATASET:
  TYPE: pedes
  NAME: UPAR
  TRAIN_SPLIT: trainval
  VAL_SPLIT: test
  ZERO_SHOT: false
  LABEL: eval
  HEIGHT: 256
  WIDTH: 128
  PHASE1_ROOT_PATH: data/smoke_epoch1/phase1/annotations/phase1/
  PHASE2_ROOT_PATH: data/smoke_epoch1/phase2/
  ROOT_PATH: data/phase1/
RELOAD:
  TYPE: true
  NAME: backbone
  PTH: checkpoints/best_model.pth
BACKBONE:
  TYPE: swin_b
CLASSIFIER:
  NAME: linear
  POOLING: avg
  SCALE: 1
  BN: false
LOSS:
  TYPE: bceloss
  LOSS_WEIGHT:
  - 1
  SAMPLE_WEIGHT: weight
TRAIN:
  CLIP_GRAD: true
  BATCH_SIZE: 16
  OPTIMIZER:
    TYPE: adam
    WEIGHT_DECAY: 0.0
  LR_SCHEDULER:
    TYPE: plateau
    LR_FT: 1.0e-05
    LR_NEW: 1.0e-05
  EMA:
    ENABLE: false
  MAX_EPOCH: 1
METRIC:
  TYPE: pedestrian
VIS:
  TENSORBOARD:
    ENABLE: false
REDIRECTOR: false
